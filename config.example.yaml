# ==============================================================================
# TurboVault configuration example
# ==============================================================================
#
# Copy to ~/.turbovault/config.yaml (read automatically when it exists), or
# pass any path with --config / TURBOVAULT_CONFIG.
#
# The file has three sections, all optional:
#
#   vaults:           the vaults to register at startup
#   tool_visibility:  which tools clients see and may call
#   security:         who may reach the server and which directories it serves
#
# Server-wide behavior (log level, reconciliation) comes from --profile; see
# docs/configuration/index.md. Unknown keys in `vaults` entries are ignored,
# so a config written for an older release still loads; an unknown key in
# `security` is refused.
#
# Precedence when registering vaults:
#   1. Vaults listed here.
#   2. Vaults restored from the cache that aren't named here.
#   3. --vault <path>, registered as "default" only if that name is free.
#   The active vault is the one with `is_default: true`, otherwise the one the
#   cache last had active.
#
# ==============================================================================

vaults:
  # A Git-backed vault: every write, and every batch, is one commit.
  # Run `git init` in the vault before using this backend.
  - name: personal
    path: ~/Documents/ObsidianVault
    is_default: true
    write_backend: git          # direct (default) or git
    git:
      branch: main              # default: the repository's current branch
      merge_strategy: merge-commit   # merge-commit (default) or fast-forward
      include_ignored: false    # refuse writes to paths .gitignore matches (default true)
      require_commit_message: false
      # author:
      #   name: TurboVault
      #   email: turbovault@example.com

    # Each of the keys below overrides the server's value for this vault.

    # Largest file read, written or scanned, in bytes. Default 10 MiB.
    max_file_size: 5242880

    # What counts as a note-adjacent file during discovery. Not access control:
    # attachments stay readable and writable by path.
    allowed_extensions: [.md, .canvas, .base]

    # Directory names the note tools may never enter, matched against every
    # path component. Added to the server's list (.obsidian, .git, ...), so a
    # vault can protect more directories but never fewer. TurboVault's own
    # .turbovault/ directory is always protected.
    excluded_paths: [.trash, private]

    # Notice edits made outside TurboVault (Obsidian, sync, git pull) before
    # serving search, graph and similarity results. Default true.
    reconcile_external_changes: true

    # What TurboVault may do to this vault's notes: read, write, delete, move,
    # or all (one name or a list). `read` alone makes the vault read-only.
    # An unknown name stops startup.
    allowed_operations: all

  # A read-only vault on the default (direct) backend.
  # - name: reference
  #   path: ~/Documents/Reference
  #   allowed_operations: read

# ------------------------------------------------------------------------------
# TOOL VISIBILITY
# ------------------------------------------------------------------------------
# Each key has a matching flag (--allowed-tools, --hidden-tools, ...) that is
# merged with it.

tool_visibility:
  # Only these tools are listed and callable. Empty means all.
  allowed: []
  # Left out of tools/list, still callable by name.
  hidden: []
  # Neither listed nor callable.
  disabled: []
  # Disable every tool carrying one of these tags (read, write, admin, ...).
  disabled_tags: []
  # List only tools annotated read-only.
  require_read_only: false
  # The 22 advanced tools are callable by name but not listed unless this is
  # set (--show-advanced-tools).
  show_advanced_tools: false

# ------------------------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------------------------
# Each key has a matching flag (shown alongside) that takes precedence.

security:
  # Directories add_vault may register vaults inside (--allowed-vault-roots).
  # Without this, runtime registration accepts any directory on stdio and none
  # on a network transport. A filesystem root, the home directory, hidden and
  # application-data directories under home, and system directories are
  # refused either way. Vaults listed under `vaults:` aren't restricted.
  allowed_vault_roots:
    - ~/Vaults

  # HTTP authentication (--auth-mode). Required to listen beyond loopback.
  auth:
    mode: none                  # none, bearer or jwt
    # This server's canonical URL; tokens must be issued for it
    # (--auth-resource). Default http://<host>:<port>/mcp.
    # resource: https://vault.example.com/mcp
    #
    # bearer: shared tokens, one per line, each at least 32 characters
    # (--auth-token-file, or one token in TURBOVAULT_AUTH_TOKEN).
    # token_file: /etc/turbovault/tokens
    #
    # jwt: tokens from an OAuth authorization server, checked for issuer,
    # audience, expiry and signature against its JWKS.
    # issuer: https://auth.example.com
    # jwks_uri: https://auth.example.com/.well-known/jwks.json
    # audience: https://vault.example.com/mcp
    # required_scopes: [vault]
    # authorization_servers: [https://auth.example.com]

  # Per-client HTTP rate limit (--rate-limit, --rate-limit-window-secs).
  # Off on loopback and 600 a minute beyond it unless set; 0 turns it off.
  # rate_limit:
  #   requests: 120
  #   window_secs: 60

  # Browser origins the HTTP transport accepts besides localhost
  # (--allowed-origins), and proxies whose forwarded client address headers
  # are trusted for rate limiting (--trusted-proxies).
  # allowed_origins: [https://app.example.com]
  # trusted_proxies: [10.0.0.0/8]

  # Listen beyond loopback without authentication
  # (--allow-unauthenticated-network). Only behind a proxy that authenticates.
  allow_unauthenticated_network: false
