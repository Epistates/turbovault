name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ── Verify ────────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The semver check needs the previous release tag.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: verify

      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          grep -q "^## \[${VERSION}\]" CHANGELOG.md

      - name: Verify formatting
        run: cargo fmt --all --check

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-semver-checks@0.51.0

      # The version being released has to be a big enough step from the
      # previous release for what changed: a breaking change needs a major
      # bump, an addition at least a minor one. CI only reports this on pull
      # requests; here it fails the release.
      - name: Verify the version bump covers the API changes
        shell: bash
        run: |
          EXCLUDE=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then EXCLUDE=(--exclude "${GITHUB_REF_NAME}"); fi
          BASELINE="$(git describe --tags --abbrev=0 --match 'v*' "${EXCLUDE[@]}" HEAD)"
          echo "Previous release: ${BASELINE}"
          cargo semver-checks --workspace --baseline-rev "${BASELINE}"

      # server.json (the MCP Registry entry) names the version in three
      # places; all of them must be the release being built.
      - name: Verify server.json matches the version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          jq -e --arg v "$VERSION" '
            .version == $v
            and ([.packages[] | select(.registryType == "cargo") | .version] == [$v])
            and ([.packages[] | select(.registryType == "oci") | .identifier]
                 == ["ghcr.io/epistates/turbovault:" + $v])
          ' server.json > /dev/null || {
            echo "::error file=server.json::server.json does not name version ${VERSION} everywhere"
            exit 1
          }

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      # Must match ci.yml's checks job: `--all-targets` does not build
      # doctests, so this is the only place a `no_run` example failing to
      # compile would otherwise be caught before it breaks a release.
      - name: Run doctests
        run: cargo test --workspace --all-features --doc --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # ── Publish Crates ───────────────────────────────────────────────────
  # Runs only on a `v*` tag, and only when CARGO_REGISTRY_TOKEN is present, so
  # a fork or a repo without the secret builds a release without publishing.
  # Waits on the builds too, so a tag whose binaries fail to build or to
  # start never reaches crates.io half-released.
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping publish step."
            exit 0
          fi
          set -euo pipefail
          # Cargo resolves the publish order from the dependency graph and waits
          # on the index between crates, so neither is scripted here. What it
          # will NOT do is tolerate a member whose version is already up: that
          # aborts the whole run before anything uploads. Two ways in. A crate
          # versioned outside the workspace (`turbovault-plugin-api`) stays put
          # across a release it did not change in, and a retry after a partial
          # run finds the crates that already landed.
          #
          # A dry run reports exactly those as warnings rather than failing, so
          # it is the pre-flight: read the names it names, exclude them, publish
          # the rest. Nothing here is a hand-maintained list.
          mapfile -t ALREADY < <(
            cargo publish --workspace --locked --dry-run 2>&1 \
              | sed -n 's/^warning: crate \([^@]*\)@.* already exists on crates.io index$/\1/p' \
              | sort -u
          )
          TOTAL="$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')"
          if [ "${#ALREADY[@]}" -eq "${TOTAL}" ]; then
            echo "All ${TOTAL} crates are already on crates.io at this version; nothing to publish."
            exit 0
          fi
          EXCLUDES=()
          for crate in "${ALREADY[@]}"; do
            echo "Already published, skipping: ${crate}"
            EXCLUDES+=(--exclude "${crate}")
          done
          cargo publish --workspace --locked "${EXCLUDES[@]}"

  # ── Build Prebuilt Binaries ───────────────────────────────────────────
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          # `smoke` marks the targets the runner can execute, so the built
          # binary is started and driven over stdio before it ships. The
          # ARM64 Linux ones are cross-compiled on x86_64 and cannot run
          # there, and macos-latest is ARM64.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
            smoke: true
          # Linux x86_64 (musl - for Alpine/static linking)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
            smoke: true
          # Linux ARM64 (glibc)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
            smoke: false
          # Linux ARM64 (musl - for Alpine/static linking)
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
            smoke: false
          # macOS x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
            smoke: false
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false
            smoke: true
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false
            smoke: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          shared-key: ${{ matrix.target }}

      # Install cross for Linux ARM builds
      # Using cargo install from git since there are no recent releases
      # (last release v0.2.5 was in Feb 2023, but development is active)
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8633ec65ab914015c2444c732568b414bd3c47cf

      # For Linux ARM, we need proper configuration
      - name: Create .cargo/config.toml for Linux ARM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          ar = "aarch64-linux-gnu-ar"
          EOF

      # cargo-auditable embeds the resolved dependency list in the binary, so
      # `cargo audit bin` can check a shipped binary years later. It wraps
      # cargo on the host, so the cross-compiled targets (built inside cross's
      # container) go without; the release SBOM covers them.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: ${{ !matrix.use_cross }}
        with:
          tool: cargo-auditable@0.7.7

      # Prebuilt binaries carry every feature (see `release` in
      # crates/turbovault/Cargo.toml); the unix socket transport exists only
      # off Windows.
      - name: Build
        run: |
          FEATURES=release
          if [ "${{ runner.os }}" != "Windows" ]; then FEATURES=release,unix; fi
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p turbovault --features "$FEATURES"
          else
            cargo auditable build --release --locked --target ${{ matrix.target }} -p turbovault --features "$FEATURES"
          fi
        shell: bash

      # Start the binary that is about to ship and hold a real MCP session
      # with it: --version, initialize, tools/list. A build that links but
      # cannot start (a missing runtime library, a panic at startup) fails
      # here instead of on a user's machine.
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          BIN="target/${{ matrix.target }}/release/turbovault"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          PYTHON=python3
          command -v python3 >/dev/null 2>&1 || PYTHON=python
          "$PYTHON" scripts/smoke_test.py --expect-version "$VERSION" "$BIN"

      # macOS Code Signing (optional - requires secrets to be configured)
      - name: Import Apple Code Signing Certificate
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: Apple-Actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Code sign and notarize macOS binary
        if: runner.os == 'macOS'
        run: |
          CERT_IMPORTED=false

          # Check if certificate was imported (if secrets exist, cert should be imported)
          if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            CERT_IMPORTED=true
          fi

          if [ "$CERT_IMPORTED" = "true" ]; then
            echo "Signing with Developer ID..."
            codesign --deep --force --verify --verbose \
              --timestamp --options runtime \
              --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
              target/${{ matrix.target }}/release/turbovault
            codesign -v target/${{ matrix.target }}/release/turbovault

            echo "Notarizing with Apple..."
            ditto -c -k --sequesterRsrc target/${{ matrix.target }}/release/turbovault turbovault-notarize.zip

            xcrun notarytool submit turbovault-notarize.zip \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_ID_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --wait \
              --timeout 30m

            echo "Note: Stapling is not applicable to bare CLI binaries"
            echo "Binary is notarized server-side - users will be verified online"

            echo "Verifying notarization status..."
            spctl -a -v target/${{ matrix.target }}/release/turbovault || true
            echo "Binary signed and notarized"
          else
            echo "::warning title=macOS binary not notarized::No Developer ID certificate is configured, so ${{ matrix.target }} is ad-hoc signed and Gatekeeper will warn users. Set the APPLE_* secrets to sign and notarize."
            codesign --remove-signature target/${{ matrix.target }}/release/turbovault || true
            codesign -s - target/${{ matrix.target }}/release/turbovault
            codesign -v target/${{ matrix.target }}/release/turbovault
            echo "Binary ad-hoc signed (users may see Gatekeeper warning)"
          fi

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          # Create artifacts directory
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $binary = "turbovault-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/turbovault.exe" $binary

          # Create zip for Windows (tar.gz not common on Windows)
          Compress-Archive -Path $binary -DestinationPath "artifacts/$binary.zip"

          # Checksum the archive that ships, the same file SHA256SUMS covers
          $hash = (Get-FileHash "artifacts/$binary.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $binary.zip" | Out-File -FilePath "artifacts/$binary.zip.sha256" -Encoding ascii -NoNewline

          Write-Host "Binary info:"
          Get-Item $binary | Format-List Length, LastWriteTime
          Get-Content "artifacts/$binary.zip.sha256"
        shell: pwsh

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          BINARY="turbovault-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/turbovault" "$BINARY"
          chmod +x "$BINARY"

          # Create tar to preserve permissions and prevent corruption
          tar -czf "artifacts/$BINARY.tar.gz" "$BINARY"
          # Checksum the archive that ships, the same file SHA256SUMS covers
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BINARY.tar.gz" > "$BINARY.tar.gz.sha256"
          else
            shasum -a 256 "$BINARY.tar.gz" > "$BINARY.tar.gz.sha256"
          fi
          ls -lh "$BINARY.tar.gz"
          cat "$BINARY.tar.gz.sha256"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  # ── Container Image ──────────────────────────────────────────────────
  # The same Dockerfile CI smoke-tests, built natively on an x86_64 and an
  # ARM64 runner (no emulation), pushed by digest, then joined into one
  # multi-arch tag on GHCR with signed build provenance.
  image:
    name: Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/epistates/turbovault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,scope=image-${{ matrix.platform }},mode=max

      - name: Smoke test this platform's image
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python3 scripts/smoke_test.py --expect-version "$VERSION" \
            docker run -i --rm "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Record the digest
        run: |
          mkdir -p digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image-publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/epistates/turbovault
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create the multi-arch tags
        working-directory: digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Resolve the index digest
        id: index
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # ── Create GitHub Release ─────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # Sigstore-signed build provenance and SBOM attestations, stored by
      # GitHub and checked with `gh attestation verify`.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p final-release

          # Copy archives directly (tar.gz and zip preserve permissions internally)
          find release-artifacts -name "*.tar.gz" -type f -exec cp {} final-release/ \;
          find release-artifacts -name "*.zip" -type f -exec cp {} final-release/ \;

          # Copy individual SHA256 files
          find release-artifacts -name "*.sha256" -type f -exec cp {} final-release/ \;

          echo "Final release contents:"
          ls -lah final-release/

          echo "Verifying archive integrity:"
          cd final-release
          for archive in *.tar.gz; do
            [ -f "$archive" ] || continue
            echo "Testing $archive:"
            tar -tzf "$archive" | head -5
          done
          for archive in *.zip; do
            [ -f "$archive" ] || continue
            echo "Testing $archive:"
            unzip -l "$archive"
          done
        shell: bash

      # One CycloneDX SBOM for the binary as released: the `release` and
      # `unix` features, dependencies for every target platform.
      - name: Generate SBOM
        run: |
          cargo cyclonedx --manifest-path crates/turbovault/Cargo.toml \
            --format json --spec-version 1.5 --features release,unix --target all \
            --override-filename turbovault.cdx -q
          cp crates/turbovault/turbovault.cdx.json "final-release/turbovault-${GITHUB_REF_NAME}.cdx.json"
        shell: bash

      - name: Generate combined checksums
        run: |
          cd final-release
          sha256sum -- *.tar.gz *.zip *.cdx.json > SHA256SUMS
          cat SHA256SUMS
        shell: bash

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            final-release/*.tar.gz
            final-release/*.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            final-release/*.tar.gz
            final-release/*.zip
          sbom-path: final-release/turbovault-${{ github.ref_name }}.cdx.json

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            final-release/*.tar.gz
            final-release/*.zip
            final-release/*.sha256
            final-release/*.cdx.json
            final-release/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
