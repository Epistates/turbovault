name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # New advisories are published against code that has not changed, so a job
  # that only runs on push and pull_request reports "green" on a main nobody
  # has audited in weeks. Monday morning, UTC.
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

# One run per ref at a time. PRs cancel their own superseded runs; pushes to
# main and the weekly audit schedule do not, so a push mid-run and Monday's
# cron never lose a result that was still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ci

      - name: Check formatting
        run: cargo fmt --all --check

      # A declared dependency nothing uses is still compiled, audited and
      # published as a requirement. Fails on any, per crate.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-machete@0.9.2

      - name: Check for unused dependencies
        run: cargo machete

      - name: Lint with clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets --locked

      # `--all-targets` deliberately excludes doctests (they are not a
      # "target" cargo builds that way), so without this step a doctest can
      # fail to compile and CI stays green.
      - name: Run doctests
        run: cargo test --workspace --all-features --doc --locked

      # Must match the release workflow's verify job, `-D warnings` included.
      # Without it a broken intra-doc link is a warning here and an error
      # there, so the first anyone hears of it is a tag failing to release.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # Ubuntu covers the fast, all-features, all-targets sweep above. Real users
  # install on all three OSes, and `unix` is Unix-only by design, so this job
  # exercises the actual install surface: default features everywhere, plus
  # the cross-platform `full` bundle on Windows specifically (the OS the
  # `unix` feature would break on if it ever leaked into a shared feature set).
  test-cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - name: Run tests (default features)
        run: cargo test --workspace --locked

      - name: Run tests (full features)
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --locked --features full

      # The feature set the prebuilt release binaries use, so a platform break
      # in it (vector search on Windows, say) fails here and not at tag time.
      - name: Build release feature set
        shell: bash
        run: |
          FEATURES=release
          if [ "$RUNNER_OS" != "Windows" ]; then FEATURES=release,unix; fi
          cargo build -p turbovault --locked --features "$FEATURES"

  # The feature flags in the install docs (README, crates/turbovault/Cargo.toml)
  # are promises about what builds standalone. This job holds each one to that
  # without paying for a full test run per combination.
  feature-check:
    name: Feature Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: no-default-features+sql
            args: --no-default-features --features sql
          - name: http
            args: --features http
          - name: http+sql
            args: --no-default-features --features http,sql
          - name: plugin-api
            args: --features plugin-api
          - name: full
            args: --features full
          - name: release
            args: --features release,unix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}

      - name: cargo check -p turbovault ${{ matrix.args }}
        run: cargo check -p turbovault ${{ matrix.args }} --locked

  # The combinations above are the documented bundles. This is every feature
  # of every crate on its own, default features off, so a feature that only
  # builds because another one happens to pull a dependency in (websocket
  # without http, say) fails here.
  feature-powerset:
    name: Feature Check (each feature alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: feature-powerset

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hack@0.6.45

      - name: cargo hack check --each-feature
        run: cargo hack check --workspace --each-feature --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: coverage

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1

      # Line coverage was 92.6% when the floor went from 75 to 90, so a change
      # that drops a few points of it is a signal rather than noise.
      - name: Enforce line coverage floor
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info --fail-under-lines 90

      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      # Unmaintained and unsound crates fail the job too. The ones only an
      # upstream release can remove are listed, each with its reason, in
      # .cargo/audit.toml and deny.toml.
      - name: Run security audit
        run: cargo audit --deny warnings
      - name: Run cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny check

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.90.0
        with:
          toolchain: "1.90.0"
      # The crates build on 1.90; the test suite needs a newer toolchain
      # (serial_test 4 wants 1.93.1), so this checks the libraries and
      # binaries, every feature on, against the lockfile users get.
      - run: cargo check --workspace --all-features --locked

  # The published crates follow semver. The baseline is the latest release
  # tag rather than crates.io, because publishing is a separate manual step
  # that can lag the tag; the tag is the API that was released.
  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: semver

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-semver-checks@0.51.0

      - name: cargo semver-checks against the latest release tag
        run: |
          BASELINE="$(git describe --tags --abbrev=0 --match 'v*' HEAD)"
          echo "Baseline: ${BASELINE}"
          cargo semver-checks --workspace --baseline-rev "${BASELINE}"

  # The write-safety matrix (crates/turbovault/tests/wss_matrix.rs) holds the
  # clobber-safety behavior every write must have. Pending cells are the known
  # gaps. This keeps them honest: an active cell failing, a pending cell that
  # now passes everywhere, or more pending trials than the committed baseline
  # each fail the job.
  wss-ratchet:
    name: Write-Safety Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wss

      - name: Run the matrix and enforce the ratchet
        run: |
          set -o pipefail
          python3 scripts/wss-report.py --ratchet docs/write-safety-suite/pending-baseline \
            | tee -a "$GITHUB_STEP_SUMMARY"
