version: 2
updates:
  # Keep the pinned SHAs in .github/workflows/*.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # An action runs in CI, with the repository's tokens, as soon as its
    # update merges, so a new release waits a week before it is proposed.
    # Security updates are not delayed.
    cooldown:
      default-days: 7

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The digest-pinned base images in Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
