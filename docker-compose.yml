# Runs TurboVault over stdio against the example vault in this repository.
# Point the volume at your own vault to use it for real:
#   - /path/to/your/vault:/var/obsidian-vault
services:
  turbovault:
    build:
      context: .
      dockerfile: Dockerfile
    image: turbovault:local
    container_name: turbovault
    volumes:
      - ./examples/docker-vault:/var/obsidian-vault
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    stdin_open: true
    tty: false
