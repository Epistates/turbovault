[package]
name = "turbovault-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Vault management, file operations, and watching"
documentation = "https://docs.rs/turbovault-vault"

[dependencies]
turbovault-core = { workspace = true }
turbovault-parser = { workspace = true }
turbovault-graph = { workspace = true }
turbovault-audit = { workspace = true }
# write-substrate-layering M3a: the git write substrate is now an
# implementation detail behind VaultManager's WriteSubstrate (design §5.1's
# `vault -> git` embedding), not a parallel tool-layer stack beside it.
turbovault-git = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
notify = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }

# File editing & diff
similar = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }

# Path security
path_trav = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# GitSubstrate unit tests init a throwaway repo directly (mirrors
# turbovault-git's own test helpers).
git2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
