[package]
name = "turbovault-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Vault management, file operations, and change tracking"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/turbovault-vault"

[dependencies]
turbovault-core = { workspace = true }
turbovault-parser = { workspace = true }
turbovault-graph = { workspace = true }
turbovault-audit = { workspace = true }
# write-substrate-layering M3a: the git write substrate is now an
# implementation detail behind VaultManager's WriteSubstrate (design §5.1's
# `vault -> git` embedding), not a parallel tool-layer stack beside it.
turbovault-git = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }

# File editing & diff
similar = { workspace = true }
# Matching a file name to its stored spelling whatever Unicode form it's in
unicode-normalization = { workspace = true }

schemars = { workspace = true, optional = true }

[features]
default = []
# JSON Schemas for the edit results the server returns (see turbovault-core).
schemars = [
    "dep:schemars",
    "turbovault-core/schemars",
    "turbovault-graph/schemars",
    "turbovault-audit/schemars",
]

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# GitSubstrate unit tests init a throwaway repo directly (mirrors
# turbovault-git's own test helpers).
git2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
