[package]
name = "turbovault-plugin-api"
# Not `version.workspace`: the plugin contract is versioned on its own so it can
# change shape without forcing a major on crates that do not depend on it. It
# joins the workspace version once there is an external plugin to break.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
description = "Stable plugin contract and curated vault facade for TurboVault"
documentation = "https://docs.rs/turbovault-plugin-api"
readme = "README.md"
keywords = ["mcp", "obsidian", "vault", "plugin", "turbovault"]
categories = ["development-tools", "text-processing"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
turbomcp-types = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
