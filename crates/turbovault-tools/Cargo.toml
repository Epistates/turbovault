[package]
name = "turbovault-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "MCP tools implementation using turbomcp"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/turbovault-tools"

[dependencies]
turbovault-core = { workspace = true }
turbovault-parser = { workspace = true }
turbovault-graph = { workspace = true }
turbovault-vault = { workspace = true }
turbovault-batch = { workspace = true }
turbovault-export = { workspace = true }
turbovault-audit = { workspace = true }
turbovault-git = { workspace = true }


tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
shellexpand = { workspace = true }
urlencoding = "2"
uuid = { workspace = true }
rayon = { workspace = true }

# Diff tools
similar = { workspace = true }


# Tier 1d: Production-grade full-text search
tantivy = { workspace = true }

# Optional: SQL query engine for frontmatter queries
turbovault-sql = { workspace = true, optional = true }

# Optional: JSON Schemas for tool results (outputSchema)
schemars = { workspace = true, optional = true, features = ["chrono04"] }

[features]
default = []
sql = ["dep:turbovault-sql"]
# JSON Schemas for every result type the tools return, so an MCP server can
# advertise each tool's outputSchema.
schemars = [
    "dep:schemars",
    "turbovault-core/schemars",
    "turbovault-parser/schemars",
    "turbovault-graph/schemars",
    "turbovault-vault/schemars",
    "turbovault-audit/schemars",
]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
proptest = { workspace = true }
# Tests only — production code uses `turbovault_git::Oid`, never git2 directly.
git2 = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
